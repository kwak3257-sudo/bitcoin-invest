[project]
name = "bitcoin-invest-backend"
version = "0.1.0"
description = "한국어 비트코인 투자 프로그램 백엔드 (API 서버 + 매매 엔진)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pyjwt>=2.8",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
